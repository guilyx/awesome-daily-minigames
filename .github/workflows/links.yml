name: Link check

# Daily games die quietly, so sweep the whole catalogue once a week and open an
# issue when something stops responding.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    name: Check every link in the README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 403 and 429 mean "a bot got blocked or throttled", not "the game is
          # gone" — plenty of these sites sit behind Cloudflare.
          #
          # Exclusions, both false positives rather than dead links:
          #   washingtonpost.com  lychee cannot complete an HTTP/2 handshake
          #                       with their edge; the games load fine in a
          #                       browser. Re-test if lychee changes.
          #   our own Pages site  404s until Pages is enabled, and once it is,
          #                       checking it here tells us nothing new.
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 40
            --max-retries 3
            --accept 200..=299,403,429
            --exclude '^https://www\.washingtonpost\.com/'
            --exclude '^https://guilyx\.github\.io/awesome-daily-minigames/'
            --exclude-path node_modules
            README.md
          output: ./lychee/out.md
          fail: false

      # Reuse one issue forever. Filing a fresh one every Monday for the same
      # slow host is how a link checker teaches everyone to ignore it.
      - name: Find the existing link-check issue
        id: existing
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken link',
              per_page: 100,
            })
            const match = issues.find(
              (issue) => !issue.pull_request && issue.title === 'Link check found dead games',
            )
            return match ? String(match.number) : ''

      - name: Open or update the link-check issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link check found dead games
          content-filepath: ./lychee/out.md
          labels: broken link
          # Empty means "no existing issue", and the action creates one.
          issue-number: ${{ steps.existing.outputs.result }}
