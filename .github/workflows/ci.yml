name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Schema, house style, https-only URLs, duplicates and ordering.
      - name: Validate data
        run: npm run validate

      # Contributors are not expected to commit README.md or docs/games.json —
      # `generate.yml` rebuilds those on master after merge. This step only
      # proves the build still runs against the new data, so a broken entry or
      # template cannot reach master and stall regeneration there.
      - name: Build (must succeed, result not committed here)
        run: npm run build
