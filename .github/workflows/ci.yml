name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Canonical ordering is CI's job, not the contributor's — the same way
      # README.md and docs/games.json are. Sorting here means a correct entry
      # dropped in the wrong alphabetical slot passes instead of failing on a
      # chore the pipeline can do itself. Nothing is committed from this job;
      # `generate.yml` commits the sorted file on master after merge.
      - name: Sort data into canonical order
        run: npm run sort

      # Schema, house style, https-only URLs and duplicates. Anything a machine
      # cannot fix still fails here.
      - name: Validate data
        run: npm run validate

      # Contributors are not expected to commit README.md or docs/games.json —
      # `generate.yml` rebuilds those on master after merge. This step only
      # proves the build still runs against the new data, so a broken entry or
      # template cannot reach master and stall regeneration there.
      - name: Build (must succeed, result not committed here)
        run: npm run build
