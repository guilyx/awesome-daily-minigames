name: Deploy site

# Publishes docs/ to GitHub Pages.
#
# docs/ is already a finished static site — index.html, the assets, and a
# games.json that CI keeps in sync with data/ — so there is nothing to build
# here, only to upload. `enablement: true` makes this workflow the Pages
# source, so it works whether Pages was previously set to "GitHub Actions" or
# to "Deploy from a branch".
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling so the last push wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload and deploy docs/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
