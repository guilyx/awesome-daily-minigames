name: Regenerate

# Keeps README.md and docs/games.json in step with data/*.yml.
#
# Contributors only ever edit data/. This workflow rebuilds the generated
# files on master after a merge and commits them, so a pull request that adds
# a game is a one-file diff and can be reviewed on its merits rather than on
# whether someone remembered to run `npm run build`.
#
# Deliberately NOT run on pull_request: regenerating a contributor's branch
# would mean either a write token on untrusted PR code (pull_request_target,
# which is a remote code execution risk) or push access to forks the token
# does not have. Running here, after merge, the code is already trusted.
on:
  push:
    branches: [master]
    paths:
      - "data/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/generate.yml"
  workflow_dispatch:

permissions:
  contents: write

# One regeneration at a time; two racing runs would fight over the push.
concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    name: Rebuild generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Canonical ordering first, then render. Both are idempotent, so a
      # contributor who did run them locally produces no diff here.
      - name: Sort and build
        run: |
          npm run sort
          npm run build

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/games.yml README.md docs/games.json; then
            echo "Generated files already up to date — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.yml README.md docs/games.json
          git commit -m "Regenerate README and site data

          Rebuilt from data/*.yml by the Regenerate workflow."
          git push
